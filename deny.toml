# cargo-deny configuration. CI runs `cargo deny check advisories` on every
# push and pull request; licenses/bans/sources are checked locally with
# `cargo deny check` (cargo install cargo-deny).
[advisories]
yanked = "deny"
unsound = "warn"
unmaintained = "warn"

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "MIT OR Apache-2.0",
  "Apache-2.0 OR MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
