name: Release

# Publishing a GitHub Release publishes every workspace crate to crates.io,
# so anyone can install the command with `cargo install vigilia`, and attaches
# the menu bar app as Vigilia-<version>.dmg.
#
# One-time setup (see "Releasing" in README.md): add a crates.io API token
# with publish scopes as the repository secret CARGO_REGISTRY_TOKEN.
#
# Optional, for a signed and notarized app: MACOS_CERT_P12 (a base64
# Developer ID Application certificate), MACOS_CERT_PASSWORD,
# MACOS_SIGNING_IDENTITY, APPLE_ID, APPLE_TEAM_ID and APPLE_APP_PASSWORD.
# Without them the app is signed ad-hoc and the release notes say how to open it.
on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the version and components; rustup installs it on first use.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check the registry token is configured
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not set; see 'Releasing' in README.md."
            exit 1
          fi

      - name: Check the release tag matches the crate version
        run: |
          version="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "vigilia"))')"
          tag="${GITHUB_REF_NAME#v}"
          echo "release tag: $GITHUB_REF_NAME, crate version: $version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match crate version '$version'. Tag the release 'v$version'."
            exit 1
          fi

      - name: Test
        run: cargo test --workspace --locked

      # Internal crates must be published before the crates that depend on
      # them, and each one must be visible in the index before the next
      # publish can resolve it. Versions that are already published are
      # skipped, so re-running a failed release is safe.
      - name: Publish crates in dependency order
        run: |
          set -euo pipefail
          version="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "vigilia"))')"
          for crate in vigilia-protocol vigilia-core vigilia-platform vigilia-daemon vigilia; do
            url="https://crates.io/api/v1/crates/$crate/$version"
            if [ "$(curl -s -o /dev/null -w '%{http_code}' -A 'vigilia-release-workflow' "$url")" = "200" ]; then
              echo "$crate $version is already published, skipping."
              continue
            fi
            echo "Publishing $crate $version"
            cargo publish --locked -p "$crate"
            for _ in $(seq 1 30); do
              if [ "$(curl -s -o /dev/null -w '%{http_code}' -A 'vigilia-release-workflow' "$url")" = "200" ]; then
                break
              fi
              sleep 10
            done
          done

      - name: Verify the published command installs
        run: cargo install vigilia --locked --root "$RUNNER_TEMP/vigilia-install" && "$RUNNER_TEMP/vigilia-install/bin/vigilia" --version

  macos-app:
    name: Attach the macOS app
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check the release tag matches the crate version
        run: |
          version="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "vigilia"))')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match crate version '$version'. Tag the release 'v$version'."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Only with the certificate secrets; otherwise build-app.sh signs ad-hoc.
      - name: Import the signing certificate
        if: env.MACOS_CERT_P12 != '' && env.MACOS_CERT_PASSWORD != '' && env.MACOS_SIGNING_IDENTITY != ''
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          # Keep the existing keychains in the search list; their paths have no spaces.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        run: apps/macos/scripts/build-app.sh

      - name: Attach the dmg to the release
        run: |
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "apps/macos/dist/Vigilia-$VERSION.dmg" \
            "apps/macos/dist/Vigilia-$VERSION.dmg.sha256"

      - name: Explain how to open an unsigned app
        if: env.SIGNING_IDENTITY == ''
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          if ! grep -q "Open Anyway" "$RUNNER_TEMP/notes.md"; then
            cat >> "$RUNNER_TEMP/notes.md" <<'NOTES'

          ### Opening the menu bar app

          `Vigilia-*.dmg` isn't notarized by Apple, so macOS blocks it the first time. Drag Vigilia to Applications and open it once; when macOS refuses, go to System Settings → Privacy & Security and click **Open Anyway** next to the message about Vigilia.
          NOTES
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
          fi
